site_name: Estruturas de Dados
site_description: >
  Livro didático de Estruturas de Dados:
  Recursividade, TAD, Listas, Pilhas, Filas, Árvores (ABB e AVL) e Ordenação (incluindo Heap Sort).
site_author: "Sergio Souza Costa"

docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Alternar para modo claro

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/lambdageo.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - "⇦ Coleção LambdaGeo": https://lambdageo.github.io/ebooks/
  - Prefácio: index.md
  - "Pré-requisito: C para Programadores Python e VisuAlg": https://lambdageo-edu.github.io/book-introducao-a-programacao-c/

  - Parte I — Fundamentos e Estruturas Lineares:
      - Capítulo 1 — Introdução: aulas/00_apresentacao.md
      - Capítulo 2 — Pilhas:
          - "2.1 Pilha Estática I: Vetores Globais": aulas/01_pilha_estatica_1.md
          - "2.2 Pilha Estática II: Funções, Ponteiros e Structs": aulas/02_pilha_estatica_2.md
          - "2.3 Pilha III: Alocação Dinâmica": aulas/03_pilha_estatica_3.md
      - Capítulo 3 — Listas:
          - "3.1 Listas Estáticas como TAD em C": aulas/04_lista_estatica.md
          - "3.2 Listas Encadeadas como TAD em C": aulas/05_lista_encadeada.md
      - Capítulo 4 — Filas:
          - "4.1 Filas como TAD em C": aulas/06_fila_tad.md

  - Parte II — Estruturas Hierárquicas e Buscas:
      - Capítulo 5 — Recursão e Algoritmos de Busca: aulas/07_recursao_busca.md
      - Capítulo 6 — Árvores e Árvores Binárias de Busca:
          - "6.1 Árvores: Conceitos e Binária": aulas/08_arvores_conceitos.md
          - "6.2 Árvores Binárias de Busca": aulas/09_arvores_busca.md
      - Capítulo 7 — Árvores Balanceadas:
          - "7.1 Árvores AVL: Conceito": aulas/10_arvores_avl_conceito.md
          - "7.2 Árvores AVL: Implementação": aulas/11_arvores_avl_implementacao.md

  - Parte III — Análise de Desempenho e Ordenação:
      - Capítulo 8 — Complexidade de Algoritmos: aulas/12_analise_complexidade.md
      - Capítulo 9 — Algoritmos de Ordenação:
          - "9.1 Algoritmos de Ordenação Básicos": aulas/13_ordenacao_basica.md
          - "9.2 Algoritmos de Ordenação Avançados": aulas/14_ordenacao_avancada.md

  - Apêndices e Prática:
      - Apêndice A — Exercícios de Fixação:
          - "Pilhas": exercicios/u1_02_pilhas.md
          - "Exercícios com Listas (Visão Geral)": exercicios/u1_03_listas_index.md
          - "Exercícios: Lista Estática": exercicios/u1_03_listas_estatica.md
          - "Exercícios: Lista Encadeada": exercicios/u1_03_listas_encadeada.md
          - "Caderno de Exercícios Gerais": exercicios/u1_04_caderno_exercicios.md
          - "Recursividade": exercicios/u2_01_recursividade.md
          - "Árvores Binárias (Estruturais)": exercicios/u2_02_arvores_binarias.md
          - "Árvores Binárias de Busca (ABB)": exercicios/u2_03_arvores_busca.md
          - "Árvores AVL": exercicios/u2_04_arvores_avl.md
      - Apêndice B — Projetos e Laboratórios:
          - "Laboratório: REPL Baseado em Pilha": laboratorios/01_repl_pilha.md
          - "Trabalho Prático: Algoritmos de Ordenação": laboratorios/02_trabalho_pratico.md